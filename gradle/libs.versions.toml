# ============================================================
# SapotLokal — Version Catalog (single source of truth for all
# library versions, per SAPOTLOKAL_BUILD_GUIDE.md Section 2)
# ============================================================

[versions]
# Build tooling
agp                     = "9.4.0"   # Android Gradle Plugin (Sep 2026)
gradle                  = "9.6.0"   # Minimum Gradle required by AGP 9.4.0

# UI
material                = "1.14.0"  # Material Components for Android (Views, maintenance mode — fine for XML-based UI)

# Firebase — managed via BoM so individual library versions are implicit
firebaseBom             = "34.19.0" # Firebase Android BoM (Sep 2026)

# QR code
mlkitBarcodeScanning    = "17.3.0"  # ML Kit Barcode Scanning (replaces ZXing for scanning — see erd-changes.md)
zxingCore               = "3.5.3"   # ZXing core (used only for QR *generation* into a Bitmap — no camera)

# CameraX — required to provide the preview/analysis stream that ML Kit scans
cameraX                 = "1.4.2"   # Latest stable (Sep 2026); added for Phase 3 scan screen

# AndroidX
coreKtx                 = "1.16.0"
appcompat               = "1.7.0"
constraintlayout        = "2.2.1"
activity                = "1.10.1"
lifecycle               = "2.9.1"

[libraries]
# Material Design
material                    = { group = "com.google.android.material",  name = "material",                  version.ref = "material" }

# AndroidX
androidx-core-ktx           = { group = "androidx.core",                name = "core-ktx",                  version.ref = "coreKtx" }
androidx-appcompat          = { group = "androidx.appcompat",            name = "appcompat",                 version.ref = "appcompat" }
androidx-constraintlayout   = { group = "androidx.constraintlayout",     name = "constraintlayout",          version.ref = "constraintlayout" }
androidx-activity-ktx       = { group = "androidx.activity",             name = "activity-ktx",              version.ref = "activity" }
androidx-lifecycle-runtime  = { group = "androidx.lifecycle",            name = "lifecycle-runtime-ktx",     version.ref = "lifecycle" }
androidx-lifecycle-viewmodel= { group = "androidx.lifecycle",            name = "lifecycle-viewmodel-ktx",   version.ref = "lifecycle" }

# Firebase (versions are managed by the BoM — do NOT specify version individually)
# Note: -ktx variants were merged into base libraries in Firebase BoM 32+. Use base names.
firebase-bom                = { group = "com.google.firebase",           name = "firebase-bom",              version.ref = "firebaseBom" }
firebase-auth               = { group = "com.google.firebase",           name = "firebase-auth" }
firebase-database           = { group = "com.google.firebase",           name = "firebase-database" }
firebase-messaging          = { group = "com.google.firebase",           name = "firebase-messaging" }

# QR scanning — ML Kit
mlkit-barcode-scanning      = { group = "com.google.mlkit",             name = "barcode-scanning",          version.ref = "mlkitBarcodeScanning" }

# QR generation — ZXing core only (no camera, no deprecated AndroidX Camera1 APIs)
zxing-core                  = { group = "com.google.zxing",             name = "core",                      version.ref = "zxingCore" }

# CameraX — camera preview + ImageAnalysis for ML Kit
camerax-core                = { group = "androidx.camera",              name = "camera-core",               version.ref = "cameraX" }
camerax-camera2             = { group = "androidx.camera",              name = "camera-camera2",            version.ref = "cameraX" }
camerax-lifecycle           = { group = "androidx.camera",              name = "camera-lifecycle",          version.ref = "cameraX" }
camerax-view                = { group = "androidx.camera",              name = "camera-view",               version.ref = "cameraX" }

# Testing
junit                       = { group = "junit",                         name = "junit",                     version = "4.13.2" }
androidx-test-ext-junit     = { group = "androidx.test.ext",             name = "junit",                     version = "1.2.1" }
androidx-espresso-core      = { group = "androidx.test.espresso",        name = "espresso-core",             version = "3.6.1" }

[plugins]
android-application         = { id = "com.android.application",         version.ref = "agp" }
