# Project-wide Gradle settings.
# See https://docs.gradle.org/current/userguide/build_environment.html

# Tell Gradle NOT to auto-download a JDK via the toolchain system.
# Android Studio's bundled JDK (JDK 21) is used instead.
# Without this, Gradle throws "Toolchain download repositories have not been configured."
org.gradle.java.installations.auto-download=false

# Daemon reduces Gradle startup time on repeated builds
org.gradle.daemon=true

# Parallel module builds — no effect yet (single-module project) but good hygiene
org.gradle.parallel=true

# Use the Gradle configuration cache for faster incremental builds
org.gradle.configuration-cache=true

# AndroidX — ensures all support library imports automatically use the AndroidX equivalents
android.useAndroidX=true

# Non-transitive R classes — reduces R class size and speeds up builds in large projects
android.nonTransitiveRClass=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
